services:
  docker-watcher:
    image: registry.localdomain:5000/docker-watcher:latest
    # Load-bearing: the Loki alert selector in alerts/build-failed.yaml
    # matches source_subsystem="docker-watcher", which vector-agent derives
    # from the container name. A generated/prefixed name breaks alerting
    # silently (design.md D-3).
    container_name: docker-watcher
    restart: unless-stopped
    env_file: .env
    volumes:
      - watcher-state:/data
    healthcheck:
      # Alive means the poll loop is still turning, not that a build
      # succeeded - main() touches /data/heartbeat every cycle regardless
      # of outcome. Staleness bound reads the same interval/timeout env
      # vars the loop itself uses, so a longer BUILD_TIMEOUT_SECONDS
      # doesn't cause false-unhealthy flaps mid-build.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/data/heartbeat') < int(os.environ.get('POLL_INTERVAL_SECONDS', 300)) + int(os.environ.get('BUILD_TIMEOUT_SECONDS', 1800)) + 120 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      # Covers a worst-case first cycle (default POLL_INTERVAL_SECONDS +
      # BUILD_TIMEOUT_SECONDS + buffer) before the first heartbeat exists.
      # Bump if those env vars are raised well past their defaults.
      start_period: 2200s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    labels:
      # ADR-9: the watcher builds itself; letting Watchtower redeploy it
      # mid-build-cycle is a self-referential race. Upgrades are a manual
      # `docker compose pull && up -d`. All other services keep Watchtower.
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  watcher-state:
